name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir -p _site/assets
          cp index.html services.html govcon.html commercial.html about.html contact.html privacy.html \
            .nojekyll README.md _site/
          cp assets/* _site/assets/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const publish = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/publish-pages.js`);
            await publish({ github, context, core });
